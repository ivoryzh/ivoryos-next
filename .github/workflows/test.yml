name: Edge Server Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        cd edge_server
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        
    - name: Run Pytest
      run: |
        cd edge_server
        pytest ../tests/automated/
