<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labware</title>
  <style>
    :root {
      --bg: #ffffff; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --soft: #f3f4f6;
      --deck: #f8fafc; --site: #cbd5e1; --ware: #ffffff; --ware-line: #94a3b8; --well: #eef2f6;
      --well-line: #b6c2cf; --tip: #475569; --fixture: #e2e8f0;
      --accent: #4a6280; --accent-soft: #e7edf4; --accent-fg: #34495f;
      font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    :root.dark {
      --bg: #141414; --ink: #f3f4f6; --muted: #9ca3af; --line: rgba(255,255,255,.1); --soft: rgba(255,255,255,.06);
      --deck: #1b1d20; --site: #3f4750; --ware: #23272c; --ware-line: #5b6672; --well: #2c3138;
      --well-line: #4a535d; --tip: #b8c4d1; --fixture: #2a2f35;
      --accent: #a9bed5; --accent-soft: rgba(140,170,205,.16); --accent-fg: #c9d7e6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    h1 { font-size: 14px; margin: 0; font-weight: 700; }
    .kind { color: var(--muted); font-size: 12px; }
    .live { margin-left: auto; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; display: inline-block; }
    .live.on i { background: #22c55e; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .tab { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 3px 9px; }
    .tab.on { background: var(--accent-soft); color: var(--accent-fg); border-color: var(--accent); }
    #stage { border: 1px solid var(--line); border-radius: 12px; background: var(--deck); overflow: hidden; position: relative; }
    svg { display: block; width: 100%; height: auto; max-height: 72vh; }
    #reset { position: absolute; top: 8px; right: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 3px 9px; font-size: 12px; }
    #activity { min-height: 20px; margin: 8px 2px 4px; font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #activity b { color: var(--ink); font-weight: 600; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 2px 10px; font-size: 12px; color: var(--muted); }
    .chip { display: inline-flex; align-items: center; gap: 5px; }
    .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 5px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
    td.name { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    td.dim { color: var(--muted); }
    td.grow { width: 100%; white-space: normal; }
    tr.row { cursor: pointer; }
    tr.row:hover td, tr.row.sel td { background: var(--soft); }
    .empty { padding: 28px 12px; text-align: center; color: var(--muted); }

    #edit { margin-left: 4px; }
    #editor { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    #editor h2 { font-size: 12px; margin: 0 0 6px; font-weight: 700; }
    #editor p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    #notice { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; padding: 7px 9px; border-radius: 8px; background: #fef3c7; color: #92400e; font-size: 12px; }
    :root.dark #notice { background: rgba(245,158,11,.14); color: #fcd34d; }
    #notice.error { background: #fee2e2; color: #991b1b; }
    :root.dark #notice.error { background: rgba(239,68,68,.16); color: #fca5a5; }
    .act { border: 1px solid var(--accent); background: var(--accent); color: var(--bg); border-radius: 7px; padding: 3px 10px; font-weight: 600; }
    .plain { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 3px 10px; }
    input[type=text], input[type=search] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; min-width: 0; }
    input:focus { outline: none; border-color: var(--accent); }
    #placer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
    #palette { max-height: 230px; overflow: auto; margin-top: 6px; border-top: 1px solid var(--line); }
    .group { position: sticky; top: 0; background: var(--bg); padding: 5px 2px 3px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .def { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; cursor: grab; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .def:hover { background: var(--soft); }
    .def.on { background: var(--accent-soft); color: var(--accent-fg); border-color: var(--accent); }
    td .plain { padding: 1px 7px; font-size: 11px; }
    .site.drop { fill: transparent; pointer-events: all; cursor: copy; }
    .site.drop.armed { stroke: var(--accent); stroke-width: 1.2; fill: var(--accent-soft); }
    .site { fill: none; stroke: var(--site); stroke-width: .7; stroke-dasharray: 2.4 2; }
    .site-label { fill: var(--site); font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .fixture { fill: var(--fixture); stroke: var(--site); stroke-width: .5; }
    .trash { fill: var(--fixture); stroke: var(--ware-line); stroke-width: .6; stroke-dasharray: 1.5 1.5; }
    .ware { fill: var(--ware); stroke: var(--ware-line); stroke-width: .8; cursor: pointer; }
    .ware.sel { stroke: var(--accent); stroke-width: 1.6; }
    .ware-name { fill: var(--ink); font-size: 5px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
    .ware-site { fill: var(--muted); font-size: 4.6px; text-anchor: end; pointer-events: none; }
    .well { fill: var(--well); stroke: var(--well-line); stroke-width: .35; }
    .tip { fill: var(--tip); }
    .tip.used { fill: none; stroke: var(--well-line); stroke-width: .4; }
    .hit { stroke: var(--accent); stroke-width: 1.3; fill: none; animation: hit 1.1s ease-out infinite; }
    @keyframes hit { 0% { stroke-opacity: 1; } 100% { stroke-opacity: .25; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Labware</h1><span class="kind" id="kind"></span>
    <div class="tabs" id="tabs"></div>
    <button class="tab" id="edit" hidden>Edit layout</button>
    <span class="live" id="live"><i></i><span>connecting</span></span>
  </header>
  <div id="stage"></div>
  <div id="editor" hidden></div>
  <div id="activity"></div>
  <div class="legend" id="legend"></div>
  <table id="list"></table>

  <script>
    // Relative URLs only: the page is served under /plugins/labware/ on whatever host the edge uses.
    // Everything drawn comes from api/layout and api/state; nothing here knows a robot or a plate.
    let layouts = {}, states = {}, current = null, zoomed = null;
    let hit = { labware: null, wells: new Set() }, hitTimer = null;
    // Rearranging the worktable: what can be placed, what is picked up, where it is about to go.
    // Per worktable: {labware: [{definition, category}], decks: [{kind, label}], deck} (labware.py CATALOG_METHOD).
    let catalogs = {}, editing = false, armed = null, pending = null, changed = false, notice = null, query = "", removing = null;
    let switching = null;  // the robot a person is about to start over on

    // The app's theme: its own setting in a browser, the system's inside the desktop app.
    function applyTheme() {
      let saved = null;
      try { saved = localStorage.getItem("ivoryos-theme"); } catch (e) { /* private window */ }
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    }
    applyTheme();
    addEventListener("storage", applyTheme);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmt = n => String(Math.round(n * 10) / 10);

    // A liquid named after a colour is drawn in it; the rest take the next colour in turn.
    const NAMED = { red: "#dc2626", blue: "#2563eb", yellow: "#eab308", green: "#16a34a", orange: "#ea580c",
                    pink: "#db2777", black: "#1f2937", water: "#7dd3fc", buffer: "#7dd3fc", dye: "#e11d48" };
    const TURN = ["#0d9488", "#ea580c", "#65a30d", "#0284c7", "#d97706", "#be185d", "#64748b", "#ca8a04"];
    const colours = {};
    function colourOf(liquid) {
      if (!colours[liquid]) {
        const word = Object.keys(NAMED).find(w => liquid.toLowerCase().includes(w));
        colours[liquid] = word ? NAMED[word] : TURN[Object.keys(colours).length % TURN.length];
      }
      return colours[liquid];
    }
    function mixed(liquids) {
      let r = 0, g = 0, b = 0, total = 0;
      for (const [name, volume] of Object.entries(liquids || {})) {
        const c = colourOf(name);
        r += parseInt(c.slice(1, 3), 16) * volume; g += parseInt(c.slice(3, 5), 16) * volume; b += parseInt(c.slice(5, 7), 16) * volume;
        total += volume;
      }
      return total ? `rgb(${Math.round(r / total)},${Math.round(g / total)},${Math.round(b / total)})` : "var(--well)";
    }

    function shortWells(wells) {
      const unique = [...new Set(wells)];
      if (unique.length <= 3) return unique.join(", ");
      return `${unique[0]} … ${unique[unique.length - 1]} (${unique.length})`;
    }

    function render() {
      const names = Object.keys(layouts);
      const stage = document.getElementById("stage");
      document.getElementById("tabs").innerHTML = names.length > 1
        ? names.map(n => `<button class="tab ${n === current ? "on" : ""}" data-tab="${esc(n)}">${esc(n)}</button>`).join("") : "";
      if (!current || !layouts[current]) {
        stage.innerHTML = `<div class="empty">No instrument on this deck reports a worktable.<br>Add a liquid handler (ivoryos_edge.plr) to see its labware here.</div>`;
        document.getElementById("kind").textContent = "";
        document.getElementById("legend").innerHTML = document.getElementById("list").innerHTML = "";
        return;
      }
      const layout = layouts[current], state = (states[current] || {}).labware || {};
      document.getElementById("title").textContent = current;
      document.getElementById("kind").textContent = (layout.deck.label || layout.deck.kind) + (layout.deck.simulated ? " · simulated" : "");

      // Everything is in millimetres from the front left; the page's y runs the other way.
      const boxes = [...layout.sites, ...layout.fixtures, ...Object.values(layout.labware)];
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const b of boxes) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
      if (!boxes.length) { x0 = 0; y0 = 0; x1 = layout.deck.width; y1 = layout.deck.depth; }
      const pad = 10, top = y1;
      const Y = (y, h) => top - (y + h);
      let view = [x0 - pad, -pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad];
      const focus = zoomed && layout.labware[zoomed];
      if (focus) view = [focus.x - 6, Y(focus.y, focus.h) - 6, focus.w + 12, focus.h + 12];

      let svg = "";
      for (const f of layout.fixtures) {
        svg += `<rect class="${f.category === "trash" ? "trash" : "fixture"}" x="${f.x}" y="${Y(f.y, f.h)}" width="${Math.max(f.w, 6)}" height="${f.h}" rx="3"><title>${esc(f.name)}</title></rect>`;
        if (f.category === "trash" && f.w > 30) svg += `<text class="site-label" style="font-size:9px" x="${f.x + f.w / 2}" y="${Y(f.y, f.h) + f.h / 2}">trash</text>`;
      }
      for (const s of layout.sites) {
        const open = editing && !s.holds;
        svg += `<rect class="site ${open ? "drop" : ""} ${open && armed ? "armed" : ""}" ${open ? `data-site="${esc(s.label)}"` : ""} x="${s.x}" y="${Y(s.y, s.h)}" width="${s.w}" height="${s.h}" rx="3"/>`;
        if (!s.holds) svg += `<text class="site-label" x="${s.x + s.w / 2}" y="${Y(s.y, s.h) + s.h / 2}">${esc(String(s.label).replace(/^.*-/, ""))}</text>`;
      }
      for (const [name, ware] of Object.entries(layout.labware)) {
        const held = state[name] || {}, tips = ware.category === "tip_rack";
        const wy = Y(ware.y, ware.h);
        svg += `<rect class="ware ${zoomed === name ? "sel" : ""}" data-ware="${esc(name)}" x="${ware.x}" y="${wy}" width="${ware.w}" height="${ware.h}" rx="2.5"/>`;
        for (const [id, [dx, dy, w, h, round]] of Object.entries(ware.spots)) {
          const cx = ware.x + dx + w / 2, cy = top - (ware.y + dy + h / 2);
          const here = held[id] || {};
          const active = hit.labware === name && hit.wells.has(id);
          if (tips) {
            const r = Math.min(3.1, ware.w / (ware.grid[0].length * 2.9));
            svg += `<circle class="tip ${here.tip === false ? "used" : ""}" cx="${cx}" cy="${cy}" r="${r}"><title>${esc(name)} ${esc(id)} · ${here.tip === false ? "used" : "tip"}</title></circle>`;
            if (active) svg += `<circle class="hit" cx="${cx}" cy="${cy}" r="${r + 1}"/>`;
            continue;
          }
          const volume = here.volume_ul || 0, full = ware.max_volume_ul ? Math.min(1, volume / ware.max_volume_ul) : (volume ? 1 : 0);
          const parts = Object.entries(here.liquids || {}).map(([l, v]) => `${l} ${fmt(v)}`).join(", ");
          const tip = `<title>${esc(name)} ${esc(id)} · ${volume ? `${fmt(volume)} µL${parts ? ` (${esc(parts)})` : ""}` : "empty"}</title>`;
          if (round) {
            const r = Math.min(w, h) / 2;
            svg += `<circle class="well" cx="${cx}" cy="${cy}" r="${r}">${tip}</circle>`;
            if (volume) svg += `<circle cx="${cx}" cy="${cy}" r="${r * (0.4 + 0.55 * Math.sqrt(full))}" fill="${mixed(here.liquids)}" pointer-events="none"/>`;
            if (active) svg += `<circle class="hit" cx="${cx}" cy="${cy}" r="${r + 0.9}"/>`;
          } else {
            const x = ware.x + dx, y = top - (ware.y + dy + h);
            svg += `<rect class="well" x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2">${tip}</rect>`;
            // Seen from above a trough has no level to show, so how full it is is how much of it is tinted.
            if (volume) svg += `<rect x="${x + 0.6}" y="${y + 0.6 + (h - 1.2) * (1 - full)}" width="${w - 1.2}" height="${(h - 1.2) * full}" rx="0.9" fill="${mixed(here.liquids)}" pointer-events="none"/>`;
            if (active) svg += `<rect class="hit" x="${x - 0.8}" y="${y - 0.8}" width="${w + 1.6}" height="${h + 1.6}" rx="1.6"/>`;
          }
        }
        svg += `<text class="ware-name" x="${ware.x + 3}" y="${wy + 5.6}">${esc(name)}</text>`;
        if (ware.site) svg += `<text class="ware-site" x="${ware.x + ware.w - 3}" y="${wy + 5.6}">${esc(String(ware.site).replace(/^.*-/, "#"))}</text>`;
      }
      stage.innerHTML = `<svg viewBox="${view.join(" ")}" role="img" aria-label="${esc(current)} worktable">${svg}</svg>`
        + (focus ? `<button id="reset">Whole worktable</button>` : "");

      const liquids = new Set();
      for (const held of Object.values(state)) for (const spot of Object.values(held)) for (const l of Object.keys(spot.liquids || {})) liquids.add(l);
      document.getElementById("legend").innerHTML = [...liquids].sort().map(l => `<span class="chip"><i style="background:${colourOf(l)}"></i>${esc(l)}</span>`).join("")
        + (Object.values(layout.labware).some(w => w.category === "tip_rack") ? `<span class="chip"><i style="background:var(--tip)"></i>tip</span>` : "");

      document.getElementById("list").innerHTML = Object.entries(layout.labware).map(([name, ware]) => {
        const held = state[name] || {}, spots = Object.keys(ware.spots).length;
        let what;
        if (ware.category === "tip_rack") what = `${Object.values(held).filter(s => s.tip !== false).length} of ${spots} tips left`;
        else {
          const filled = Object.values(held).filter(s => s.volume_ul > 0);
          const total = filled.reduce((sum, s) => sum + s.volume_ul, 0);
          what = filled.length ? `${filled.length} of ${spots} ${spots === 1 ? "filled" : "wells hold liquid"} · ${total >= 1000 ? fmt(total / 1000) + " mL" : fmt(total) + " µL"}` : "empty";
        }
        return `<tr class="row ${zoomed === name ? "sel" : ""}" data-ware="${esc(name)}"><td class="name">${esc(name)}</td><td class="dim">${esc(ware.category.replace("_", " "))}</td><td class="dim">${ware.site ? esc(ware.site) : ""}</td><td class="grow">${esc(what)}</td>${editing ? `<td><button class="plain" data-remove="${esc(name)}">${removing === name ? "Really remove" : "Remove"}</button></td>` : ""}</tr>`;
      }).join("");
      const offered = catalogs[current] || {};
      const canEdit = (offered.labware || []).length > 0 || (offered.decks || []).length > 0, button = document.getElementById("edit");
      button.hidden = !canEdit;
      button.classList.toggle("on", editing);
      button.textContent = editing ? "Done" : "Edit layout";
    }

    // --- rearranging the worktable ----------------------------------------------------------------
    const PREFIX = { plate: "plate", tip_rack: "tips", reservoir: "reservoir", tube_rack: "tubes" };
    function freeName(category) {
      const taken = Object.keys((layouts[current] || {}).labware || {}), prefix = PREFIX[category] || "labware";
      for (let n = 1; ; n++) if (!taken.includes(`${prefix}_${n}`)) return `${prefix}_${n}`;
    }

    function renderPalette() {
      const words = query.toLowerCase().split(/\s+/).filter(Boolean);
      const shown = ((catalogs[current] || {}).labware || []).filter(d => words.every(w => d.definition.toLowerCase().includes(w)));
      let html = "", group = null;
      for (const d of shown) {
        if (d.category !== group) { group = d.category; html += `<div class="group">${esc(group.replace("_", " "))}s</div>`; }
        html += `<button class="def ${armed && armed.definition === d.definition ? "on" : ""}" draggable="true" data-def="${esc(d.definition)}" data-cat="${esc(d.category)}" title="${esc(d.definition)}">${esc(d.definition)}</button>`;
      }
      document.getElementById("palette").innerHTML = html || `<div class="empty">Nothing matches.</div>`;
    }

    function renderEditor() {
      const editor = document.getElementById("editor");
      editor.hidden = !editing && !changed && !notice;
      if (editor.hidden) return;
      let html = "";
      if (notice) html += `<div id="notice" class="error">${esc(notice)}</div>`;
      else if (changed) html += `<div id="notice">The worktable changed. Steps offer the new labware once the deck restarts.<button class="act" id="restart">Restart deck</button></div>`;
      const decks = (catalogs[current] || {}).decks || [], here = (catalogs[current] || {}).deck;
      if (editing && decks.length) {
        // Which robot this is, as configuration: the simulator can be any of them. Saved in the
        // worktable file, so the next start is the same robot, with no flag or second script.
        const target = switching && decks.find(d => d.kind === switching);
        html += `<div id="placer">Robot <select id="deck">${decks.map(d => `<option value="${esc(d.kind)}" ${d.kind === (switching || here) ? "selected" : ""}>${esc(d.label)}</option>`).join("")}</select>`
          + (target ? ` <span>Start over on ${target.starter ? "a ready-made" : "an empty"} ${esc(target.label)} worktable? What is on this one is taken off.</span><button class="act" id="switch">Switch</button><button class="plain" id="keep">Cancel</button>` : "")
          + `</div>`;
      }
      if (editing) {
        html += pending
          ? `<div id="placer">Place <b>${esc(pending.definition)}</b> at ${esc(pending.site)} as <input type="text" id="name" value="${esc(pending.name)}" size="14"><button class="act" id="place">Place</button><button class="plain" id="cancel">Cancel</button></div>`
          : `<h2>Add labware</h2><p>${armed ? `Now click an empty place on the worktable for <b>${esc(armed.definition)}</b>.` : "Drag a labware onto an empty place, or click one and then the place. This records what you put on the worktable; nothing moves."}</p>`;
        html += `<input type="search" id="query" placeholder="Search PyLabRobot labware (e.g. 96 wellplate, tiprack 300)" value="${esc(query)}" style="width:100%"><div id="palette"></div>`;
      }
      editor.innerHTML = html;
      if (editing) renderPalette();
      const name = document.getElementById("name");
      if (name) { name.focus(); name.select(); }
    }

    async function applyEdit(change) {
      const response = await fetch("api/edit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ worktable: current, ...change }) });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) { notice = result.error || "That could not be done."; renderEditor(); return; }
      notice = null; changed = true; pending = null; armed = null; removing = null; switching = null;
      layouts = result.layout.worktables || layouts;
      catalogs = result.catalog || catalogs;
      states = (await (await fetch("api/state")).json()).worktables || {};
      render(); renderEditor();
    }

    function choose(site) {
      if (!armed) return;
      pending = { site, definition: armed.definition, name: freeName(armed.category) };
      notice = null;
      renderEditor();
    }

    document.addEventListener("input", e => { if (e.target.id === "query") { query = e.target.value; renderPalette(); } });
    document.addEventListener("change", e => {
      if (e.target.id !== "deck") return;
      switching = e.target.value === (catalogs[current] || {}).deck ? null : e.target.value;
      renderEditor();
    });
    document.addEventListener("keydown", e => { if (e.target.id === "name" && e.key === "Enter") document.getElementById("place").click(); });
    document.addEventListener("dragstart", e => {
      const def = e.target.closest && e.target.closest("[data-def]");
      if (!def) return;
      armed = { definition: def.dataset.def, category: def.dataset.cat };
      e.dataTransfer.setData("text/plain", armed.definition);
      e.dataTransfer.effectAllowed = "copy";
      render();
    });
    document.addEventListener("dragover", e => { if (armed && e.target.closest && e.target.closest("[data-site]")) e.preventDefault(); });
    document.addEventListener("drop", e => {
      const site = e.target.closest && e.target.closest("[data-site]");
      if (!site) return;
      e.preventDefault();
      choose(site.dataset.site);
    });

    document.addEventListener("click", e => {
      const def = e.target.closest("[data-def]"), site = e.target.closest("[data-site]"), remove = e.target.closest("[data-remove]");
      if (e.target.id === "edit") { editing = !editing; armed = pending = removing = notice = switching = null; render(); renderEditor(); return; }
      if (def) { armed = armed && armed.definition === def.dataset.def ? null : { definition: def.dataset.def, category: def.dataset.cat }; pending = null; render(); renderEditor(); return; }
      if (site) { choose(site.dataset.site); return; }
      if (remove) {
        if (removing === remove.dataset.remove) applyEdit({ action: "remove", name: removing });
        else { removing = remove.dataset.remove; render(); }
        return;
      }
      if (e.target.id === "place") { applyEdit({ action: "place", site: pending.site, definition: pending.definition, name: document.getElementById("name").value }); return; }
      if (e.target.id === "cancel") { pending = null; renderEditor(); return; }
      if (e.target.id === "switch") { applyEdit({ action: "deck", deck: switching }); return; }
      if (e.target.id === "keep") { switching = null; renderEditor(); return; }
      if (e.target.id === "restart") {
        fetch("/api/system/restart", { method: "POST" }).then(async r => {
          if (r.ok) { changed = false; editing = false; notice = null; }
          else notice = (await r.json().catch(() => ({}))).error || "The deck could not be restarted.";
          render(); renderEditor();
        });
        return;
      }
      const tab = e.target.closest("[data-tab]"), ware = e.target.closest("[data-ware]");
      if (tab) { current = tab.dataset.tab; zoomed = null; render(); }
      else if (e.target.id === "reset") { zoomed = null; render(); }
      else if (ware) { zoomed = zoomed === ware.dataset.ware ? null : ware.dataset.ware; render(); }
    });

    async function loadLayout() {
      layouts = (await (await fetch("api/layout")).json()).worktables || {};
      if (!current || !layouts[current]) current = Object.keys(layouts)[0] || null;
    }
    async function load() {
      await loadLayout();
      states = (await (await fetch("api/state")).json()).worktables || {};
      catalogs = (await (await fetch("api/catalog")).json()).worktables || {};
      render();
      renderEditor();
    }

    async function onMessage(message) {
      if (!message || !message.worktable) return;
      states[message.worktable] = message.state || {};
      if (message.relayout) await loadLayout();
      const event = message.event || {};
      if (message.worktable === current && event.labware) {
        hit = { labware: event.labware, wells: new Set(event.wells || []) };
        clearTimeout(hitTimer);
        hitTimer = setTimeout(() => { hit = { labware: null, wells: new Set() }; render(); }, 1600);
      }
      const words = { aspirate: "aspirate from", dispense: "dispense into", pick_up_tips: "pick up tips from", drop_tips: "drop tips", move: "move", load: "loaded" };
      document.getElementById("activity").innerHTML = event.action
        ? `${esc(words[event.action] || event.action)} ${event.labware ? `<b>${esc(event.labware)}</b>` : ""} ${esc(shortWells(event.wells || []))}` : "";
      render();
    }

    function connect() {
      const url = new URL("events", location.href);
      url.protocol = url.protocol.replace("http", "ws");
      const ws = new WebSocket(url), live = document.getElementById("live");
      ws.onopen = () => { live.classList.add("on"); live.lastElementChild.textContent = "live"; };
      ws.onmessage = e => onMessage(JSON.parse(e.data));
      ws.onclose = () => {  // the edge restarted: reconnect, and read the worktable again
        live.classList.remove("on"); live.lastElementChild.textContent = "reconnecting";
        setTimeout(() => { connect(); load().catch(() => {}); }, 2000);
      };
    }

    load().then(connect);
  </script>
</body>
</html>
