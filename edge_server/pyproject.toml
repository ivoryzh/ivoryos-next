[project]
name = "ivoryos-edge"
version = "0.1.0"
description = "IvoryOS Edge Server"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-socketio[client]",
    "pydantic",
    "python-dotenv",
    "aiohttp",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "paho-mqtt",
    "httpx>=0.28.1",
    "pandas",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx"
]
# Only needed to expose the deck to an MCP client such as Claude Desktop
# (python -m ivoryos_edge.agent.mcp_server). The edge server itself never imports it.
mcp = [
    "mcp>=1.2.0"
]
