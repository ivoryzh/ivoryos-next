[project]
name = "ivoryos-edge"
version = "0.1.0"
description = "IvoryOS Edge Server"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-socketio[client]",
    "pydantic",
    "python-dotenv",
    "aiohttp",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "paho-mqtt",
    "httpx>=0.28.1",
    "pandas",
]

[project.scripts]
ivoryos-edge = "ivoryos_edge.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx"
]
# Only needed to expose the deck to an MCP client such as Claude Desktop
# (python -m ivoryos_edge.agent.mcp_server). The edge server itself never imports it.
mcp = [
    "mcp>=1.2.0"
]
# The assistant's Claude provider (agent/providers.py). Ollama and OpenAI-compatible endpoints
# need nothing beyond httpx; Claude uses Anthropic's own SDK.
claude = [
    "anthropic>=1.0"
]
# Liquid handlers through PyLabRobot (plr.py): worktables, labware definitions and backends for
# Hamilton, Opentrons and Tecan, plus a simulator. Nothing else in the edge imports it.
plr = [
    "pylabrobot>=0.2.2"
]

# The Labware view's page ships with the package (labware_view/__init__.py).
[tool.setuptools.package-data]
"ivoryos_edge.labware_view" = ["page/*"]
