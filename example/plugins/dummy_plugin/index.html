<!DOCTYPE html>
<html>
<head>
    <title>Dummy Plugin</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { margin-top: 0; color: #2563eb; }
        p { color: #6b7280; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to the Dummy Plugin</h1>
        <p>This is a completely custom web app loaded directly from local files.</p>
        <p>No separate server required!</p>
        <button onclick="alert('Hello from the embedded iframe plugin!')">Click Me!</button>
    </div>
</body>
</html>
